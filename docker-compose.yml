services:
  mysql:
    image: mysql:8.0
    container_name: mysql-archivage
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: archivage_doc
      MYSQL_USER: archivage_user
      MYSQL_PASSWORD: archivage_pass
    ports:
      - "3306:3306"
    networks:
      - archivage-net

  app:
    build:
      context: .
    image: archivage-app:compose
    container_name: app-archivage
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-archivage:3306/archivage_doc?useUnicode=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: archivage_user
      SPRING_DATASOURCE_PASSWORD: archivage_pass
      GITHUB_OAUTH_SECRET: "${GITHUB_OAUTH_SECRET:-ci-dummy-client-secret}"
      JWT_SECRET: "${JWT_SECRET:-***REMOVED***}"
    ports:
      - "8090:8090"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - archivage-net

networks:
  archivage-net:
    name: archivage-net
