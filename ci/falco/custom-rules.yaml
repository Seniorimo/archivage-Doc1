# ci/falco/falco-rules.yaml
- rule: Suspicious HTTP Response in App Container
  desc: Detects unusual syscalls in app-archivage during ZAP scan
  condition: >
    spawned_process and
    container.name = "app-archivage"
  output: >
    Suspicious process in app container
    (user=%user.name cmd=%proc.cmdline container=%container.name
     image=%container.image.repository parent=%proc.pname)
  priority: WARNING
  tags: [devsecops, zap]

- rule: File Write in App Container
  desc: Detects file writes inside app-archivage
  condition: >
    open_write and
    container.name = "app-archivage" and
    not fd.name startswith "/proc"
  output: >
    File write detected (file=%fd.name user=%user.name
    cmd=%proc.cmdline container=%container.name)
  priority: WARNING
  tags: [devsecops, zap]

- rule: Outbound Connection from App
  desc: Detects unexpected outbound connections from app-archivage
  condition: >
    outbound and
    container.name = "app-archivage"
  output: >
    Outbound connection (dest=%fd.rip:%fd.rport
    cmd=%proc.cmdline container=%container.name)
  priority: WARNING
  tags: [devsecops, zap]