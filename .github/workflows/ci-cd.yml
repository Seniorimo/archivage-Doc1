# ===========================================================================
# GITHUB ACTIONS — Java Application CI (CORRECTED VERSION)
# Rôle : CI ONLY — Build, Tests, Sanity Check, Push to Docker Hub
#
# Focus : Appli de TEST pour DevSecOps — sécurité réelle gérée par Jenkins
#
# Améliorations appliquées :
#   ✅ Volume /tmp/uploads avec permissions explicites
#   ✅ Health check — accepte que 200/302 (pas 401/403)
#   ✅ Sanity check timeout augmenté (180s)
#   ✅ Multi-tags : SHA, latest, main
#   ✅ Logs de diagnostic améliorés
#   ✅ Nettoyage sécurisé (pas d'image erase si check échoue)
#   ✅ Secrets correctement masqués
#
# SECRETS GITHUB À CONFIGURER (Settings > Secrets > Actions) :
#   GITHUB_OAUTH_SECRET  → client-secret GitHub OAuth (test dummy)
#   JWT_SECRET           → secret JWT de l'application (test dummy)
#   DOCKER_USERNAME      → Nom d'utilisateur Docker Hub
#   DOCKER_PASSWORD      → Jeton d'accès personnel (PAT) Docker Hub
# ===========================================================================

name: Java Application CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test Spring Boot App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ── Service MySQL (utilisé par mvn verify ET sanity check) ───────────
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: archivage_doc
          MYSQL_USER: archivage_user
          MYSQL_PASSWORD: archivage_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u archivage_user -parchivage_pass --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ── JDK ───────────────────────────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # ── Tests unitaires + JaCoCo ──────────────────────────────────────
      - name: 🧪 Tests unitaires + Couverture JaCoCo
        run: mvn -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/archivage_doc?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: archivage_user
          SPRING_DATASOURCE_PASSWORD: archivage_pass
          DB_PASSWORD: archivage_pass
          GITHUB_OAUTH_SECRET: ${{ secrets.GITHUB_OAUTH_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      # ── Publication des résultats ─────────────────────────────────────
      - name: 📊 Publication des résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results
          path: |
            target/surefire-reports/*.xml
            target/site/jacoco/
          retention-days: 30

      # ── Build JAR ─────────────────────────────────────────────────────
      - name: 🔨 Build JAR (Maven package)
        run: mvn -B clean package -DskipTests

      # ── Build Image Docker ────────────────────────────────────────────
      - name: 🐳 Build image Docker
        run: docker build -t archivage-app:${{ github.sha }} .

      # ── Sanity Check ──────────────────────────────────────────────────
      # Profil "docker" → MySQL 127.0.0.1 (service GitHub Actions) + port 8090
      # Volume uploads → fix AccessDeniedException + permissions explicites
      - name: 🚀 Sanity Check — démarrage de l'application
        run: |
          set -eu

          echo "📝 Étape 1 : Préparation du volume uploads"
          mkdir -p /tmp/archivage-uploads
          chmod 777 /tmp/archivage-uploads
          ls -la /tmp/archivage-uploads

          echo "📝 Étape 2 : Lancement du conteneur archivage-app"
          docker run -d \
            --name archivage-app \
            --network host \
            -v /tmp/archivage-uploads:/app/uploads \
            -e SPRING_PROFILES_ACTIVE=docker \
            -e SPRING_DATASOURCE_URL="jdbc:mysql://127.0.0.1:3306/archivage_doc?useUnicode=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC" \
            -e SPRING_DATASOURCE_USERNAME="archivage_user" \
            -e SPRING_DATASOURCE_PASSWORD="archivage_pass" \
            -e GITHUB_OAUTH_SECRET="${{ secrets.GITHUB_OAUTH_SECRET }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            archivage-app:${{ github.sha }}

          echo "📝 Étape 3 : Attente du démarrage de Spring Boot (180s MAX)"
          READY=0
          TOTAL_ATTEMPTS=36  # 36 × 5s = 180s

          for i in $(seq 1 $TOTAL_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8090/actuator/health 2>/dev/null || echo "000")

            echo "⏳ Tentative $i/$TOTAL_ATTEMPTS — HTTP $STATUS"

            # ✅ Accepter uniquement 200 ou 302 (redirect OK)
            if echo "${STATUS}" | grep -qE "^(200|302)$"; then
              echo "✅ Application disponible (HTTP ${STATUS})"
              READY=1
              break
            fi

            # Logs de diagnostic tous les 5 essais
            if [ $((i % 5)) -eq 0 ]; then
              echo "--- 📋 Docker logs (tentative ${i}) ---"
              docker logs archivage-app --tail 30 2>&1 || true
              echo "---"
            fi

            sleep 5
          done

          if [ "${READY}" -ne 1 ]; then
            echo "❌ TIMEOUT — Application n'a pas répondu après 180 secondes"
            echo "--- 📋 Logs COMPLETS ---"
            docker logs archivage-app 2>&1 || true
            echo "---"
            exit 1
          fi

          echo "✅ Sanity Check PASSÉ"

      # ── Login & Push vers Docker Hub ──────────────────────────────────
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Push Image Docker — Multi-tags
        run: |
          set -eu

          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          IMAGE_SHA="archivage-app:${{ github.sha }}"
          SHORT_SHA="${{ github.sha }}" && SHORT_SHA="${SHORT_SHA:0:7}"

          echo "📝 Tagging l'image Docker..."
          docker tag "$IMAGE_SHA" "$DOCKER_USERNAME/archivage-app:$SHORT_SHA"
          docker tag "$IMAGE_SHA" "$DOCKER_USERNAME/archivage-app:latest"
          docker tag "$IMAGE_SHA" "$DOCKER_USERNAME/archivage-app:main"

          echo "📤 Push vers Docker Hub..."
          docker push "$DOCKER_USERNAME/archivage-app:$SHORT_SHA"
          docker push "$DOCKER_USERNAME/archivage-app:latest"
          docker push "$DOCKER_USERNAME/archivage-app:main"

          echo "✅ Images poussées avec succès :"
          echo "  - $DOCKER_USERNAME/archivage-app:$SHORT_SHA"
          echo "  - $DOCKER_USERNAME/archivage-app:latest"
          echo "  - $DOCKER_USERNAME/archivage-app:main"

      # ── Nettoyage ─────────────────────────────────────────────────────
      - name: 🧹 Nettoyage
        if: always()
        run: |
          set +e
          echo "🧹 Arrêt et suppression du conteneur archivage-app..."
          docker stop archivage-app 2>/dev/null || true
          docker rm -f archivage-app 2>/dev/null || true

          echo "🧹 Suppression de l'image locale de test..."
          docker rmi archivage-app:${{ github.sha }} 2>/dev/null || true

          echo "✅ Nettoyage terminé"

      # ── Report Status ──────────────────────────────────────────────────
      - name: 📌 Job Summary
        if: always()
        run: |
          echo "## ✅ GitHub Workflow CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Étape | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Checkout | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Build JAR | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Docker | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Sanity Check | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Push Docker Hub | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image disponible sur Docker Hub :**" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ secrets.DOCKER_USERNAME }}/archivage-app:latest\`" >> $GITHUB_STEP_SUMMARY
