name: Java Application CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: archivage-app
  APP_CONTAINER: archivage-app
  UPLOADS_DIR: /tmp/archivage-uploads

jobs:
  build-and-test:
    name: Build & Test Spring Boot App
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: archivage_doc
          MYSQL_USER: archivage_user
          MYSQL_PASSWORD: archivage_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u archivage_user -parchivage_pass --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run tests with JaCoCo
        run: mvn -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/archivage_doc?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: archivage_user
          SPRING_DATASOURCE_PASSWORD: archivage_pass
          DB_PASSWORD: archivage_pass
          GITHUB_OAUTH_SECRET: ${{ secrets.GITHUB_OAUTH_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results
          path: |
            target/surefire-reports/*.xml
            target/site/jacoco/

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Sanity check application container
        run: |
          set -eu

          mkdir -p "${UPLOADS_DIR}"
          chmod 777 "${UPLOADS_DIR}"

          docker run -d --name "${APP_CONTAINER}" \
            --network host \
            --security-opt no-new-privileges:true \
            --memory 768m \
            --cpus 1.0 \
            -v "${UPLOADS_DIR}:/app/uploads" \
            -e SPRING_PROFILES_ACTIVE=docker \
            -e SPRING_DATASOURCE_URL="jdbc:mysql://127.0.0.1:3306/archivage_doc?useUnicode=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC" \
            -e SPRING_DATASOURCE_USERNAME="archivage_user" \
            -e SPRING_DATASOURCE_PASSWORD="archivage_pass" \
            -e GITHUB_OAUTH_SECRET="${GITHUB_OAUTH_SECRET}" \
            -e JWT_SECRET="${JWT_SECRET}" \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          READY=0

          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8090/actuator/health 2>/dev/null || echo "000")

            if echo "${STATUS}" | grep -qE "^(200|302|401|403)$"; then
              echo "Application available (HTTP ${STATUS})"
              READY=1
              break
            fi

            echo "Attempt ${i}/24 - HTTP ${STATUS}"

            if [ $((i % 5)) -eq 0 ]; then
              docker logs "${APP_CONTAINER}" --tail 20 2>&1 || true
            fi

            sleep 5
          done

          if [ "${READY}" -ne 1 ]; then
            docker logs "${APP_CONTAINER}" 2>&1 || true
            exit 1
          fi
        env:
          GITHUB_OAUTH_SECRET: ${{ secrets.GITHUB_OAUTH_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu

          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${DOCKER_USERNAME}/archivage-app:${GITHUB_SHA}"
          docker push "${DOCKER_USERNAME}/archivage-app:${GITHUB_SHA}"
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "${APP_CONTAINER}" 2>/dev/null || true
          docker rmi "${IMAGE_NAME}:${GITHUB_SHA}" 2>/dev/null || true

          if [ -n "${DOCKER_USERNAME:-}" ]; then
            docker rmi "${DOCKER_USERNAME}/archivage-app:${GITHUB_SHA}" 2>/dev/null || true
          fi
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
